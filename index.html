<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  .lawyer-hero {
    background-color: #1a1a1a; 
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    text-align: center;
  }
  .hero-photo {
    width: 300px;
    height: 400px;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    margin-bottom: 30px;
    border: 2px solid #b8860b; /* Золотистая рамка */
  }
  .name-title {
    font-family: 'Georgia', serif;
    font-size: 42px;
    margin: 0;
    letter-spacing: 1px;
  }
  .city-label {
    font-size: 16px;
    color: #a0a0a0;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<section class="lawyer-hero">
  <img src="https://i.ibb.co/qL3sqg5R/DSC02276.jpg" alt="Адвокат Глеб Чугунов" class="hero-photo">
  
  <h1 class="name-title">АДВОКАТ ГЛЕБ ЧУГУНОВ</h1>
  <p class="city-label">г. Санкт-Петербург</p>
</section>

</body>
</html>
